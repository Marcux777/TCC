[build-system]
requires = ["setuptools==80.10.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pequiflux-experiment"
version = "0.1.0"
description = "Reproducible experiment support for PequiFlux"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.5,<3",
    "pandas>=3.0,<4",
    "scipy>=1.18,<2",
    "pyarrow>=25,<26",
    "matplotlib>=3.11,<4",
    "pytest>=9,<10",
    "nbformat>=5.11,<6",
    "nbclient>=0.11,<1",
    "nbconvert>=7.17,<8",
    "ipykernel>=7.3,<8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
